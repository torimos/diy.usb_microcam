[global]
    server role = standalone server
    security = user
    map to guest = Never
    server min protocol = SMB2_02
    smb ports = 445
    disable netbios = yes
    load printers = no
    disable spoolss = yes
    hosts allow = 127.0.0.1 192.168.50.0/24

[screenshots]
    path = /home/pi/diy.usb_microcam/screenshots
    read only = no
    guest ok = no
    valid users = pi
    follow symlinks = no
